name: Tidefolk browser QA
on:
  push:
    branches: [main]
    paths:
      - 'tidefolk-v01/**'
      - '.github/scripts/tidefolk-*'
      - '.github/workflows/tidefolk-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tidefolk-browser-qa
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded 0.1.1 recovery, only when not already applied
        run: |
          python .github/scripts/tidefolk-recover.py tidefolk-v01
          for file in tidefolk-v01/*.js; do node --check "$file"; done
      - name: Install browser test tools outside the game
        run: |
          mkdir -p /tmp/tidefolk-qa
          cd /tmp/tidefolk-qa
          npm init -y
          npm install --save-exact playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Verify desktop, Android and iPhone browser behavior
        env:
          GAME_DIR: ${{ github.workspace }}/tidefolk-v01
          REPORT_DIR: ${{ github.workspace }}/tidefolk-qa-results
        run: |
          cp .github/scripts/tidefolk-smoke.cjs /tmp/tidefolk-qa/smoke.cjs
          node /tmp/tidefolk-qa/smoke.cjs
      - name: Publish only tested recovery files
        run: |
          git add -- tidefolk-v01/ui.js tidefolk-v01/world.js tidefolk-v01/style.css
          if ! git diff --cached --quiet; then
            git config user.name 'Tidefolk release automation'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(tidefolk): publish browser-tested 0.1.1 recovery'
            git push origin HEAD:main
          fi
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify all six pinned raw.githack files
        env:
          GAME_DIR: ${{ github.workspace }}/tidefolk-v01
          REPORT_DIR: ${{ github.workspace }}/tidefolk-qa-results
          HOST_ONLY: '1'
        run: node /tmp/tidefolk-qa/smoke.cjs
      - name: Retain source, screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidefolk-source-and-browser-qa
          path: |
            tidefolk-v01/
            tidefolk-qa-results/
          retention-days: 14
