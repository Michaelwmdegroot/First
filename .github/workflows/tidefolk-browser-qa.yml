name: Tidefolk browser QA
on:
  push:
    paths:
      - 'tidefolk-v01/**'
      - '.github/workflows/tidefolk-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools outside the game
        run: |
          mkdir -p /tmp/tidefolk-qa
          cd /tmp/tidefolk-qa
          npm init -y
          npm install --save-exact playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Verify source and test desktop, Android and iPhone layouts
        env:
          GAME_DIR: ${{ github.workspace }}/tidefolk-v01
          REPORT_DIR: ${{ github.workspace }}/tidefolk-qa-results
          RELEASE_SHA: ${{ github.sha }}
        run: |
          for file in tidefolk-v01/*.js; do node --check "$file"; done
          cat > /tmp/tidefolk-qa/smoke.cjs <<'JS'
          const { chromium, webkit, devices } = require('playwright');
          const fs = require('node:fs');
          const path = require('node:path');
          const http = require('node:http');
          const crypto = require('node:crypto');
          const assert = require('node:assert/strict');
          const out = process.env.REPORT_DIR;
          fs.mkdirSync(out, { recursive: true });
          const report = { commit: process.env.RELEASE_SHA, testedAt: new Date().toISOString(), browsers: [], hosting: {} };
          const types = { '.html': 'text/html', '.js': 'application/javascript', '.css': 'text/css' };
          const server = http.createServer((req, res) => {
            const name = new URL(req.url, 'http://localhost').pathname.split('/').pop() || 'index.html';
            if (!['index.html', 'style.css', 'data.js', 'sim.js', 'world.js', 'ui.js'].includes(name)) { res.writeHead(404); res.end(); return; }
            res.setHeader('Content-Type', types[path.extname(name)]);
            res.end(fs.readFileSync(path.join(process.env.GAME_DIR, name)));
          });
          const click = async (page, selector, touch) => { const el = page.locator(selector).first(); if(touch) await el.tap(); else await el.click(); };
          async function test(engine, name, options, touch) {
            const result = { name, checks: [], errors: [] }; report.browsers.push(result);
            const browser = await engine.launch({ headless: true, ...(name.startsWith('chromium') ? { args: ['--enable-webgl', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'] } : {}) });
            const context = await browser.newContext(options);
            const page = await context.newPage();
            page.on('pageerror', e => result.errors.push(e.message));
            try {
              await page.goto('http://127.0.0.1:8787/', { waitUntil: 'load' });
              await page.waitForFunction(() => !!window.tidefolk);
              assert.equal(await page.locator('#fatal').isVisible(), false);
              await page.screenshot({path: path.join(out, name+'-welcome.png')});
              result.renderer = await page.evaluate(() => ({ keys: Object.keys(tidefolk.view), webgl: !!tidefolk.view.gl }));
              await click(page, '[data-act="begin"]', touch);
              await page.waitForFunction(() => tidefolk.sim.s.started && document.querySelector('#modal').hidden);
              assert.equal(await page.evaluate(() => tidefolk.sim.people.length), 4);
              await page.screenshot({path: path.join(out, name+'-new-game.png')});
              result.checks.push('New story opens with four individual citizens');
              for (const panel of ['people','build','knowledge','supplies','journal','settings']) {
                await click(page, '[data-act="'+panel+'"]', touch);
                assert.equal(await page.locator('#panel').isVisible(), true);
                assert.equal(await page.evaluate(() => tidefolk.sim.s.paused), true);
                await page.screenshot({path:path.join(out,name+'-'+panel+'.png')});
                await click(page, '[data-act="close"]', touch);
              }
              result.checks.push('All six panels open and close with touch/mouse, and pause the simulation');
              await click(page, '[data-act="build"]', touch);
              await click(page, '[data-act="preview:hearth"]', touch);
              assert.equal(await page.locator('#placement').isVisible(), true);
              const point = await page.evaluate(() => { const p=tidefolk.view.project(0, .55, 1); return {x:p.x,y:p.y}; });
              if(touch) await page.touchscreen.tap(point.x,point.y); else await page.mouse.click(point.x,point.y);
              const placement = await page.locator('#placement').innerText();
              result.placementText = placement;
              if (await page.locator('[data-act="place"]').isEnabled()) {
                await click(page, '[data-act="place"]', touch);
                assert.ok(await page.evaluate(() => tidefolk.sim.buildings.some(b=>b.type==='hearth')));
                result.checks.push('Hearth placed through build card, ground tap and confirmation');
              } else {
                result.checks.push('Placement preview opens and validates resource/terrain constraints');
                await click(page, '[data-act="cancelplace"]', touch);
              }
              await click(page, '[data-act="people"]', touch);
              const idsBefore = await page.evaluate(() => { tidefolk.save(); return tidefolk.sim.people.map(p=>p.id); });
              const saveBefore = await page.evaluate(() => localStorage.getItem('tidefolk.firsthearth.v1'));
              assert.ok(saveBefore && JSON.parse(saveBefore));
              await page.reload();
              await page.waitForFunction(() => !!window.tidefolk);
              await click(page, '[data-act="continue"]', touch);
              assert.deepEqual(await page.evaluate(() => tidefolk.sim.people.map(p=>p.id)), idsBefore);
              result.checks.push('Native localStorage save survives reload and Continue preserves citizen IDs');
              await page.evaluate(() => { tidefolk.save(); tidefolk.act('mainmenu'); });
              const realSave = await page.evaluate(() => localStorage.getItem('tidefolk.firsthearth.v1'));
              await click(page, '[data-act="demo"]', touch);
              await page.waitForTimeout(1000);
              await page.evaluate(() => tidefolk.save());
              assert.equal(await page.evaluate(() => localStorage.getItem('tidefolk.firsthearth.v1')), realSave);
              await page.screenshot({path:path.join(out,name+'-sample-village.png')});
              result.checks.push('Sample village runs without overwriting the real save');
              const beforeZoom=await page.evaluate(()=>tidefolk.view.zoom);
              await click(page,'[data-act="zoom:1"]',touch);
              assert.ok(await page.evaluate(()=>tidefolk.view.zoom)>beforeZoom);
              result.checks.push('Camera zoom button responds');
              result.layout=await page.evaluate(()=>({width:innerWidth,height:innerHeight,scrollWidth:document.documentElement.scrollWidth,canvasWidth:document.querySelector('#world').width,canvasHeight:document.querySelector('#world').height}));
              assert.ok(result.layout.scrollWidth <= result.layout.width+1,'Horizontal layout overflow');
              assert.deepEqual(result.errors, []);
              result.passed=true;
            } catch(e) {
              result.passed=false; result.failure=e.stack;
              await page.screenshot({path:path.join(out,name+'-failure.png')}).catch(()=>{});
            } finally { await browser.close(); }
          }
          (async()=>{
            await new Promise(resolve=>server.listen(8787,'127.0.0.1',resolve));
            await test(chromium,'chromium-desktop',{viewport:{width:1440,height:960}},false);
            await test(chromium,'chromium-android',{...devices['Pixel 7']},true);
            await test(webkit,'webkit-iphone',{...devices['iPhone 13']},true);
            const base='https://raw.githack.com/Michaelwmdegroot/First/'+process.env.RELEASE_SHA+'/tidefolk-v01/';
            report.hosting.url=base+'index.html';
            try {
              report.hosting.files=[];
              for(const name of ['index.html','style.css','data.js','sim.js','world.js','ui.js']) {
                const response=await fetch(base+name,{signal:AbortSignal.timeout(30000)});
                const bytes=Buffer.from(await response.arrayBuffer());
                const expected=fs.readFileSync(path.join(process.env.GAME_DIR,name));
                const row={name,status:response.status,type:response.headers.get('content-type'),sameBytes:bytes.equals(expected),sha256:crypto.createHash('sha256').update(bytes).digest('hex')};
                report.hosting.files.push(row);
              }
              report.hosting.passed=report.hosting.files.every(r=>r.status===200&&r.sameBytes);
            } catch(e){report.hosting.passed=false;report.hosting.error=e.message;}
            fs.writeFileSync(path.join(out,'report.json'),JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
            server.close();
            process.exitCode=report.browsers.every(r=>r.passed)?0:1;
          })().catch(e=>{console.error(e);server.close();process.exitCode=1;});
          JS
          node /tmp/tidefolk-qa/smoke.cjs
      - name: Retain source and screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidefolk-source-and-browser-qa
          path: |
            tidefolk-v01/
            tidefolk-qa-results/
          retention-days: 14
