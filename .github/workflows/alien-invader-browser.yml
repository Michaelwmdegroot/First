name: Alien Invader browser release
on:
  push:
    branches: [alien-invader-browser-v1]
    paths: ['alien-invader/**', '.github/workflows/alien-invader-browser.yml']
  workflow_dispatch:
concurrency:
  group: alien-invader-browser
  cancel-in-progress: true
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alien-invader-browser-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble and verify tested browser sources
        run: |
          set -euo pipefail
          mkdir -p qa-results
          node alien-invader/build.mjs
          for file in alien-invader/*.js; do node --input-type=module --check < "$file"; done
      - name: Deterministic system acceptance
        run: |
          set -euo pipefail
          node alien-invader/tests/simulation.mjs | tee qa-results/simulation.txt
      - name: Five normal-action campaign victories
        env:
          QA_REPORT: qa-results/campaigns.json
        run: |
          set -euo pipefail
          node alien-invader/tests/campaign.mjs | tee qa-results/campaigns.txt
          test -s qa-results/campaigns.json
      - name: Install isolated browser QA dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium webkit
      - name: Real browser acceptance and screenshots
        env:
          QA_DIR: qa-results/browser
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 --directory alien-invader > qa-results/server.log 2>&1 &
          for n in $(seq 1 20); do curl --fail --silent http://127.0.0.1:8000/index.html > /dev/null && break; sleep 1; done
          node alien-invader/tests/browser.mjs | tee qa-results/browser.txt
          test -s qa-results/browser/report.json
          node -e "const r=require('./qa-results/browser/report.json'); if(r.length!==2 || !r.every(x=>x.saveLoad && x.allScreens && x.pageErrors.length===0)) process.exit(1)"
      - name: Commit verified static runtime on isolated game branch
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alien-invader/app.js alien-invader/style.css alien-invader/engine.js alien-invader/globe.js
          if ! git diff --cached --quiet; then
            git commit -m 'release(alien-invader): publish verified playable browser runtime'
            git push origin HEAD:alien-invader-browser-v1
          fi
          REVISION=$(git rev-parse HEAD)
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "https://rawcdn.githack.com/Michaelwmdegroot/First/$REVISION/alien-invader/index.html" | tee qa-results/play-url.txt
      - name: Verify public rawgithack deployment
        env:
          QA_DIR: qa-results/live
          LIVE: '1'
          PLAY_URL: https://rawcdn.githack.com/Michaelwmdegroot/First/${{ steps.publish.outputs.revision }}/alien-invader/index.html
        run: |
          set -euo pipefail
          node alien-invader/tests/browser.mjs | tee qa-results/live.txt
          test -s qa-results/live/report.json
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alien-invader-qa
          path: qa-results/
          retention-days: 30
      - name: Package complete browser game
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alien-invader-browser
          path: alien-invader/
          retention-days: 30
