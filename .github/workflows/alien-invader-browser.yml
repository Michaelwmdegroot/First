name: Alien Invader browser build
on:
  push:
    branches: [alien-invader-browser-v1]
    paths: ['alien-invader/**', '.github/workflows/alien-invader-browser.yml']
  workflow_dispatch:
concurrency:
  group: alien-invader-browser
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alien-invader-browser-v1
      - name: Vendor pinned browser dependencies
        run: |
          if [ ! -f alien-invader/vendor/three.module.js ]; then
            mkdir -p /tmp/ais-three /tmp/ais-world alien-invader/vendor
            cd /tmp/ais-three
            npm pack three@0.180.0 --ignore-scripts
            tar -xzf three-0.180.0.tgz
            cd /tmp/ais-world
            npm pack world-atlas@2.0.2 --ignore-scripts
            tar -xzf world-atlas-2.0.2.tgz
            cd "$GITHUB_WORKSPACE"
            cp /tmp/ais-three/package/build/three.module.js alien-invader/vendor/
            cp /tmp/ais-three/package/build/three.core.js alien-invader/vendor/
            cp /tmp/ais-three/package/examples/jsm/controls/OrbitControls.js alien-invader/vendor/
            cp /tmp/ais-three/package/LICENSE alien-invader/vendor/THREE-LICENSE.txt
            cp /tmp/ais-world/package/countries-50m.json alien-invader/vendor/
            cp /tmp/ais-world/package/LICENSE alien-invader/vendor/WORLD-ATLAS-LICENSE.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add alien-invader/vendor
            git commit -m 'build(alien-invader): vendor Three.js 0.180.0 and World Atlas 2.0.2'
            git pull --rebase origin alien-invader-browser-v1
            git push origin HEAD:alien-invader-browser-v1
          fi
      - name: Validate game JavaScript
        run: |
          for file in alien-invader/*.js; do node --input-type=module --check < "$file"; done
          if [ -f alien-invader/tests/simulation.mjs ]; then node alien-invader/tests/simulation.mjs; fi
      - name: Package browser game
        uses: actions/upload-artifact@v4
        with:
          name: alien-invader-browser
          path: alien-invader/
          retention-days: 30
