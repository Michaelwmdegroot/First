name: FireRed Native Web V0.1

on:
  push:
    branches:
      - feature/firered-native-v01-20260920
    paths:
      - 'firered-native-v01/**'
      - '.github/workflows/firered-native-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          uname -a
          clang --version
          wasm-ld --version
          python3 --version

      - name: Fetch native FireRed base
        run: |
          git clone https://github.com/jommg/pokefirered-pc-port.git /tmp/pokefirered-pc
          git -C /tmp/pokefirered-pc checkout ea42ca1672eb457ba86442093a6df3119fbcee5f
          git -C /tmp/pokefirered-pc rev-parse HEAD

      - name: Record platform inventory
        run: |
          printf '%s\n' "FireRed native base:" > firered-native-v01/bootstrap-result.txt
          git -C /tmp/pokefirered-pc rev-parse HEAD >> firered-native-v01/bootstrap-result.txt
          printf '%s\n' "Platform sources:" >> firered-native-v01/bootstrap-result.txt
          find /tmp/pokefirered-pc/src/platform -maxdepth 1 -type f -printf '%f\n' | sort >> firered-native-v01/bootstrap-result.txt
          cat firered-native-v01/bootstrap-result.txt

      - uses: actions/upload-artifact@v4
        with:
          name: firered-native-bootstrap
          path: firered-native-v01/bootstrap-result.txt
