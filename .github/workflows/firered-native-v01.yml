name: FireRed Native Web V0.1

on:
  push:
    branches:
      - feature/firered-native-v01-20260920
    paths:
      - 'firered-native-v01/**'
      - '.github/workflows/firered-native-v01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install WASM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld build-essential python3 git libpng-dev

      - name: Toolchain
        run: |
          clang --version
          wasm-ld --version
          python3 --version

      - name: Run FireRed native-to-WASM compile probe
        run: bash firered-native-v01/probe.sh

      - name: Show probe result
        if: always()
        run: |
          test -f firered-native-v01/probe.log && tail -n 180 firered-native-v01/probe.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firered-native-wasm-probe
          path: firered-native-v01/probe.log
          if-no-files-found: warn
